services:
  mongodb:
    image: mongo:latest
    container_name: campus-mongodb
    restart: unless-stopped
    volumes:
      - campus-mongo-data:/data/db
    networks:
      - campus-network

  user-service:
    build: ./user-service
    container_name: user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - USER_SERVICE_PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/user_db
      - MONGODB_DB_NAME=user_db
    depends_on:
      - mongodb
    networks:
      - campus-network

  product-service:
    build: ./product-service
    container_name: product-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - PRODUCT_SERVICE_PORT=3002
      - MONGO_URI=mongodb://mongodb:27017/product_db
      - MONGODB_DB_NAME=product_db
    depends_on:
      - mongodb
    networks:
      - campus-network

  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - ORDER_SERVICE_PORT=3003
      - MONGO_URI=mongodb://mongodb:27017/order_db
      - MONGODB_DB_NAME=order_db
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - REQUEST_TIMEOUT_MS=3000
    depends_on:
      - mongodb
      - user-service
      - product-service
    networks:
      - campus-network

networks:
  campus-network:
    name: campus-network

volumes:
  campus-mongo-data:
    name: campus-mongo-data
