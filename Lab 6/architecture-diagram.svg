<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; fill: #64748b; }
      .box-client { fill: #f8fafc; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      .box-gateway { fill: #f8fafc; stroke: #8b5cf6; stroke-width: 2; stroke-dasharray: 6 4; rx: 8; }
      .box-network { fill: #f0fdf4; stroke: #10b981; stroke-width: 2.5; rx: 12; }
      .box-service-user { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .box-service-prod { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; rx: 8; }
      .box-service-order { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; rx: 8; }
      .box-db { fill: #ffffff; stroke: #475569; stroke-width: 1.5; rx: 6; }
      .header-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .sub-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .port-tag { font-family: 'Consolas', monospace; font-size: 11px; font-weight: 600; fill: #0284c7; }
      .call-text { font-family: 'Consolas', monospace; font-size: 11px; font-weight: 600; fill: #be185d; }
      .net-label { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #047857; }
      .arrow { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-dashed { stroke: #db2777; stroke-width: 2; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrowhead-pink); }
      .arrow-db { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-gray); }
    </style>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-pink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#db2777" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="550" y="45" text-anchor="middle" class="title">CampusConnect Microservices Architecture (Lab 6)</text>
  <text x="550" y="70" text-anchor="middle" class="subtitle">Docker Compose • Shared Docker Network (campus-network) • Database-per-Service Isolation</text>

  <!-- External Client / Postman Box -->
  <g transform="translate(100, 110)">
    <rect width="900" height="90" class="box-client" />
    <text x="450" y="32" class="header-text">External Host Environment (Client Layer)</text>
    <text x="450" y="55" class="sub-text">Postman / Browser / Integration Tests accessing exposed host ports</text>
    <rect x="50" y="60" width="220" height="22" rx="4" fill="#dbeafe" />
    <text x="160" y="75" text-anchor="middle" class="port-tag">Host Port :3001 (User)</text>
    <rect x="340" y="60" width="220" height="22" rx="4" fill="#fef08a" />
    <text x="450" y="75" text-anchor="middle" class="port-tag">Host Port :3002 (Product)</text>
    <rect x="630" y="60" width="220" height="22" rx="4" fill="#fce7f3" />
    <text x="740" y="75" text-anchor="middle" class="port-tag">Host Port :3003 (Order)</text>
  </g>

  <!-- Optional API Gateway Concept -->
  <g transform="translate(380, 230)">
    <rect width="340" height="46" class="box-gateway" />
    <text x="170" y="22" class="header-text" font-size="13px">API Gateway (Conceptual Routing Layer)</text>
    <text x="170" y="38" class="sub-text" font-size="11px">Routes /users → :3001 | /products → :3002 | /orders → :3003</text>
  </g>

  <!-- Docker Network Boundary -->
  <rect x="60" y="300" width="980" height="470" class="box-network" />
  <text x="85" y="330" class="net-label">Docker Shared Network: campus-network (Isolated container-to-container communication)</text>

  <!-- USER SERVICE -->
  <g transform="translate(100, 360)">
    <rect width="260" height="180" class="box-service-user" />
    <text x="130" y="32" class="header-text">User Service</text>
    <text x="130" y="52" class="sub-text">Container: user-service</text>
    <rect x="30" y="65" width="200" height="24" rx="4" fill="#ffffff" stroke="#bfdbfe" />
    <text x="130" y="81" text-anchor="middle" class="port-tag">Internal Port :3001</text>
    <text x="130" y="112" class="sub-text" font-weight="600">CRUD /users &amp; /users/:id</text>
    <text x="130" y="132" class="sub-text">Validates user existence</text>
    <text x="130" y="152" class="sub-text">Returns 200 OK or 404</text>

    <!-- User Database -->
    <g transform="translate(30, 220)">
      <rect width="200" height="85" class="box-db" />
      <text x="100" y="28" class="header-text" font-size="13px">User DB (user_db)</text>
      <text x="100" y="48" class="sub-text" font-size="11px">Owned strictly by User Service</text>
      <text x="100" y="68" class="sub-text" font-size="10px">Users &amp; Counters collections</text>
    </g>
    <!-- DB Arrow -->
    <path d="M 130 180 L 130 220" class="arrow-db" />
  </g>

  <!-- PRODUCT SERVICE -->
  <g transform="translate(420, 360)">
    <rect width="260" height="180" class="box-service-prod" />
    <text x="130" y="32" class="header-text">Product Service</text>
    <text x="130" y="52" class="sub-text">Container: product-service</text>
    <rect x="30" y="65" width="200" height="24" rx="4" fill="#ffffff" stroke="#fde047" />
    <text x="130" y="81" text-anchor="middle" class="port-tag">Internal Port :3002</text>
    <text x="130" y="112" class="sub-text" font-weight="600">CRUD /products &amp; /products/:id</text>
    <text x="130" y="132" class="sub-text">Catalog &amp; Price validation</text>
    <text x="130" y="152" class="sub-text">Returns 200 OK or 404</text>

    <!-- Product Database -->
    <g transform="translate(30, 220)">
      <rect width="200" height="85" class="box-db" />
      <text x="100" y="28" class="header-text" font-size="13px">Product DB (product_db)</text>
      <text x="100" y="48" class="sub-text" font-size="11px">Owned strictly by Product Service</text>
      <text x="100" y="68" class="sub-text" font-size="10px">Products &amp; Counters collections</text>
    </g>
    <!-- DB Arrow -->
    <path d="M 130 180 L 130 220" class="arrow-db" />
  </g>

  <!-- ORDER SERVICE -->
  <g transform="translate(740, 360)">
    <rect width="260" height="180" class="box-service-order" />
    <text x="130" y="32" class="header-text">Order Service</text>
    <text x="130" y="52" class="sub-text">Container: order-service</text>
    <rect x="30" y="65" width="200" height="24" rx="4" fill="#ffffff" stroke="#fbcfe8" />
    <text x="130" y="81" text-anchor="middle" class="port-tag">Internal Port :3003</text>
    <text x="130" y="112" class="sub-text" font-weight="600">POST /orders &amp; GET /orders</text>
    <text x="130" y="132" class="sub-text">Orchestrates validation via REST</text>
    <text x="130" y="152" class="sub-text">Graceful 503 on dependency down</text>

    <!-- Order Database -->
    <g transform="translate(30, 220)">
      <rect width="200" height="85" class="box-db" />
      <text x="100" y="28" class="header-text" font-size="13px">Order DB (order_db)</text>
      <text x="100" y="48" class="sub-text" font-size="11px">Owned strictly by Order Service</text>
      <text x="100" y="68" class="sub-text" font-size="10px">Orders &amp; Snapshots collections</text>
    </g>
    <!-- DB Arrow -->
    <path d="M 130 180 L 130 220" class="arrow-db" />
  </g>

  <!-- Inter-Service REST Calls (Arrows) -->
  <!-- Order Service to Product Service -->
  <path d="M 740 430 L 680 430" class="arrow-dashed" />
  <rect x="683" y="405" width="55" height="18" rx="3" fill="#fdf2f8" stroke="#f472b6" />
  <text x="710" y="418" text-anchor="middle" class="call-text">REST GET</text>

  <!-- Order Service to User Service (Curved across top of services) -->
  <path d="M 780 360 C 780 325, 320 325, 320 360" class="arrow-dashed" />
  <rect x="460" y="315" width="160" height="20" rx="4" fill="#fdf2f8" stroke="#f472b6" />
  <text x="540" y="329" text-anchor="middle" class="call-text">REST GET /users/:id</text>

  <!-- Client Traffic Arrows -->
  <path d="M 230 200 L 230 360" class="arrow" />
  <path d="M 550 200 L 550 360" class="arrow" />
  <path d="M 870 200 L 870 360" class="arrow" />

  <!-- Shared Volume Annotation at bottom -->
  <rect x="250" y="700" width="600" height="35" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
  <text x="550" y="722" text-anchor="middle" class="sub-text" font-weight="600">
    Docker Volume: campus-mongo-data (Underlying persistent storage for isolated service databases)
  </text>
</svg>
